<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChromaCorrect Controls</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon"></div>
      <span class="logo-title">ChromaCorrect</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle-enabled" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="body" id="main-controls">
    <div class="form-group">
      <label for="deficiency-select">Vision Profile</label>
      <select id="deficiency-select">
        <option value="deuteranopia">Deuteranopia (Green-blind)</option>
        <option value="deuteranomaly">Deuteranomaly (Green-weak)</option>
        <option value="protanopia">Protanopia (Red-blind)</option>
        <option value="protanomaly">Protanomaly (Red-weak)</option>
        <option value="tritanopia">Tritanopia (Blue-blind)</option>
        <option value="tritanomaly">Tritanomaly (Blue-weak)</option>
        <option value="achromatopsia">Achromatopsia (Monochrome)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="assist-mode-select">Graph Assist Strategy</label>
      <select id="assist-mode-select">
        <option value="daltonize_patterns">Daltonization + Texture Patterns</option>
        <option value="daltonize">Daltonization (Color wavelength shift)</option>
        <option value="patterns">High-Contrast Texture Fills</option>
        <option value="highContrast">Edge Outlines & Max Contrast</option>
        <option value="safePalette">CVD-Safe Color Remapping</option>
      </select>
    </div>

    <div class="form-group">
      <div class="slider-header">
        <label for="intensity-slider">Filter Intensity</label>
        <span id="intensity-value">85%</span>
      </div>
      <input type="range" id="intensity-slider" min="10" max="100" value="85">
    </div>

    <div class="toggles-grid">
      <label class="checkbox-row">
        <input type="checkbox" id="toggle-inspector" checked>
        <span>Color Name Hover Inspector</span>
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="toggle-edges" checked>
        <span>High-Contrast Slice Outlines</span>
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="toggle-labels" checked>
        <span>Direct Graph Line Labels</span>
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="toggle-images" checked>
        <span>Web Image & Diagram Color Correction</span>
      </label>
    </div>

    <div class="scope-actions">
      <button class="btn btn-primary" id="apply-btn">Apply to This Page</button>
      <button class="btn btn-outline" id="reset-btn">Reset</button>
    </div>
  </div>

  <div class="footer">
    <span>Works on SVG, Canvas, and Image charts</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
